# Mnemosyne Node 独立配置示例
# 复制为 data_dir/node.config.json 时请用 CLI：mnemosyne config init
# 环境变量可覆盖：
#   MNEMOSYNE_HOME
#   MNEMOSYNE_MEMORY_BANK / MNEMOSYNE_DATA_DIR / DSH_MEMORY_DATA_DIR（记忆库）
#   DSH_MEMORY_TOKEN / DSH_MEMORY_HOST / DSH_MEMORY_PORT
# 默认记忆库：%LOCALAPPDATA%\Mnemosyne Memory Bank（与代码仓分离）

node:
  id: local-node
  name: My Mnemosyne
  mode: standalone

runtime:
  host: 127.0.0.1
  port: 8765

storage:
  provider: sqlite
  bank_name: Mnemosyne Memory Bank
  # 实际路径由 --data-dir / MNEMOSYNE_MEMORY_BANK 决定；勿把密钥写入本文件
  path: ./data/memory.db

security:
  authentication: required
  remote_access: disabled
  token_env: DSH_MEMORY_TOKEN

components:
  profiles:
    - core-default

# Mnemosyne Node 独立配置示例
# 复制为 data_dir/node.config.json 时请用 CLI：mnemosyne config init
# 环境变量可覆盖：MNEMOSYNE_HOME / DSH_MEMORY_DATA_DIR / DSH_MEMORY_TOKEN / DSH_MEMORY_HOST / DSH_MEMORY_PORT

node:
  id: local-node
  name: My Mnemosyne
  mode: standalone

runtime:
  host: 127.0.0.1
  port: 8765

storage:
  provider: sqlite
  # 实际路径由 --data-dir / DSH_MEMORY_DATA_DIR 决定；勿把密钥写入本文件
  path: ./data/memory.db

security:
  authentication: required
  remote_access: disabled
  token_env: DSH_MEMORY_TOKEN

components:
  profiles:
    - core-default
